<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIT AF | Digital Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  @font-face { font-family:'Termina'; src:local('Termina'); font-weight:100 900; font-display:swap; }
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --pink:#F43CE2;--pink-dim:rgba(244,60,226,0.12);--pink-glow:rgba(244,60,226,0.25);
    --bg:#0B0B12;--card:rgba(18,18,28,0.85);--card-solid:#13131F;
    --card-border:rgba(255,255,255,0.07);--card-hover:rgba(26,26,40,0.9);
    --text:#FFF;--text-dim:rgba(255,255,255,0.45);--text-mid:rgba(255,255,255,0.7);
    --green:#00E676;--red:#FF5252;--blue:#448AFF;--orange:#FF9100;
    --tiktok:#00F2EA;--facebook:#1877F2;--instagram:#E1306C;--google:#4285F4;
    --radius:20px;--radius-sm:12px;
    --font-heading:'Termina','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:'Avenir','Avenir Next','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    /* location accent colors */
    --loc-407:#F43CE2;--loc-gnv:#00F2EA;--loc-jax:#448AFF;--loc-850:#FF9100;--loc-af:#00E676;--loc-corp:#7C4DFF;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;min-height:100vh;overflow-x:hidden;}
  h1,h2,h3,h4,h5,h6,.logo-mark,.logo-text span:first-child,.section-label,.metric-value,.platform-stat-value,.ad-metric-value,.chart-title,.nav-tab,.loc-tab{font-family:var(--font-heading);}

  /* HEADER */
  .header{background:linear-gradient(180deg,rgba(244,60,226,0.06) 0%,transparent 100%);border-bottom:1px solid var(--card-border);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
  .logo-area{display:flex;align-items:center;gap:18px;}
  .logo-svg{height:44px;width:auto;object-fit:contain;}
  .logo-divider{width:1px;height:36px;background:rgba(255,255,255,0.1);}
  .logo-text{display:flex;flex-direction:column;}
  .logo-text span:first-child{font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text);}
  .logo-text span:last-child{font-size:11px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font-body);}
  .header-right{display:flex;align-items:center;gap:16px;}
  .header-date{font-size:13px;color:var(--text-dim);}
  .header-badge{background:var(--pink-dim);color:var(--pink);font-size:11px;font-weight:600;padding:6px 16px;border-radius:50px;border:1px solid rgba(244,60,226,0.2);letter-spacing:1px;text-transform:uppercase;font-family:var(--font-heading);}

  /* NAV TABS */
  .nav-tabs{display:flex;gap:6px;padding:14px 40px;border-bottom:1px solid var(--card-border);background:rgba(11,11,18,0.9);backdrop-filter:blur(12px);position:sticky;top:85px;z-index:99;}
  .nav-tab{padding:10px 24px;font-size:12px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid var(--card-border);border-radius:50px;cursor:pointer;transition:all 0.25s;letter-spacing:0.8px;text-transform:uppercase;}
  .nav-tab:hover{color:var(--text-mid);background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.12);}
  .nav-tab.active{color:#000;background:var(--pink);border-color:var(--pink);font-weight:700;}

  /* LOCATION TABS */
  .loc-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .loc-tab{padding:8px 20px;font-size:11px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid var(--card-border);border-radius:50px;cursor:pointer;transition:all 0.25s;letter-spacing:0.6px;text-transform:uppercase;}
  .loc-tab:hover{color:var(--text-mid);background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.12);}
  .loc-tab.active{color:#000;font-weight:700;}

  /* MONTH TABS */
  .month-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .month-tab{padding:7px 18px;font-size:10px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid var(--card-border);border-radius:50px;cursor:pointer;transition:all 0.25s;letter-spacing:0.6px;text-transform:uppercase;font-family:var(--font-heading);}
  .month-tab:hover{color:var(--text-mid);background:rgba(255,255,255,0.04);}
  .month-tab.active{color:#000;background:var(--pink);border-color:var(--pink);font-weight:700;}

  /* MAIN */
  .main{padding:28px 40px 60px;max-width:1480px;margin:0 auto;}
  .section-label{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:16px;margin-top:8px;display:flex;align-items:center;gap:14px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--card-border);}

  /* METRIC CARDS */
  .metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:32px;}
  .metrics-row-4{grid-template-columns:repeat(4,1fr);}
  .metric-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;transition:all 0.3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;backdrop-filter:blur(10px);}
  .metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink),rgba(244,60,226,0.3));opacity:0;transition:opacity 0.3s;}
  .metric-card:hover{background:var(--card-hover);border-color:rgba(244,60,226,0.15);transform:translateY(-3px);box-shadow:0 12px 40px rgba(244,60,226,0.08);}
  .metric-card:hover::before{opacity:1;}
  .metric-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:16px;}
  .metric-label{font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;font-family:var(--font-body);}
  .metric-value{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1.1;}
  .metric-change{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:10px;padding:4px 10px;border-radius:50px;font-family:var(--font-body);}
  .metric-change.up{color:var(--green);background:rgba(0,230,118,0.1);}
  .metric-change.down{color:var(--red);background:rgba(255,82,82,0.1);}
  .metric-change.neutral{color:var(--text-dim);background:rgba(255,255,255,0.05);}

  /* LOCATION CARDS */
  .loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;}
  .loc-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:22px;transition:all 0.3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px);position:relative;overflow:hidden;}
  .loc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0.8;}
  .loc-card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.2);}
  .loc-card-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--card-border);}
  .loc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .loc-card-name{font-size:13px;font-weight:700;font-family:var(--font-heading);letter-spacing:0.5px;}
  .loc-card-city{font-size:10px;color:var(--text-dim);letter-spacing:0.5px;margin-left:auto;}
  .loc-stat{margin-bottom:14px;}
  .loc-stat:last-child{margin-bottom:0;}
  .loc-stat-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-family:var(--font-body);}
  .loc-stat-value{font-size:20px;font-weight:700;letter-spacing:-0.5px;font-family:var(--font-heading);}
  .loc-stat-sub{font-size:10px;font-weight:600;margin-top:2px;font-family:var(--font-body);}

  /* PLATFORM / INSIGHT CARDS */
  .platform-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:26px;transition:all 0.3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px);}
  .platform-card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.2);}
  .platform-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--card-border);}
  .platform-name{display:flex;align-items:center;gap:10px;}
  .platform-dot{width:10px;height:10px;border-radius:50%;}
  .platform-name span{font-size:15px;font-weight:700;font-family:var(--font-heading);letter-spacing:0.5px;}
  .platform-badge{font-size:11px;font-weight:500;padding:5px 12px;border-radius:50px;background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid var(--card-border);}
  .insights-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:32px;}

  /* CHARTS */
  .charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:32px;}
  .chart-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;backdrop-filter:blur(10px);}
  .chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .chart-title{font-size:14px;font-weight:700;letter-spacing:0.3px;}
  .chart-container{position:relative;height:280px;}

  /* AUDIENCE ROW */
  .audience-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;}
  .audience-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;backdrop-filter:blur(10px);}
  .audience-card-name{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;font-family:var(--font-heading);}
  .audience-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px;}
  .audience-row-label{color:var(--text-dim);}
  .audience-row-value{color:var(--text);font-weight:600;}

  /* TABLE */
  .table-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;margin-bottom:32px;overflow:hidden;backdrop-filter:blur(10px);}
  .table-wrapper{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:12px 16px;border-bottom:1px solid var(--card-border);font-family:var(--font-heading);}
  tbody td{padding:14px 16px;font-size:13px;color:var(--text-mid);border-bottom:1px solid rgba(255,255,255,0.03);}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:last-child td{border-bottom:none;}

  /* FOOTER */
  .footer{border-top:1px solid var(--card-border);padding:24px 40px;display:flex;align-items:center;justify-content:space-between;}
  .footer-left{font-size:12px;color:var(--text-dim);}
  .footer-brand{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .footer-brand a{color:var(--pink);text-decoration:none;font-weight:600;}

  .section{display:none;}
  .section.active{display:block;}

  /* highlight best metric in green */
  .best{color:var(--green) !important;}

  /* TOP POSTS */
  .posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:32px;}
  .post-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;transition:all 0.3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px);position:relative;overflow:hidden;}
  .post-card:hover{background:var(--card-hover);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.2);}
  .post-card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .post-platform-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
  .post-type-badge{font-size:9px;font-weight:700;padding:3px 10px;border-radius:50px;text-transform:uppercase;letter-spacing:0.8px;font-family:var(--font-heading);}
  .post-rank{margin-left:auto;font-size:11px;color:var(--text-dim);font-weight:600;font-family:var(--font-heading);}
  .post-caption{font-size:12px;color:var(--text-mid);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .post-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--card-border);}
  .post-stat{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);}
  .post-stat-value{color:var(--text);font-weight:600;}
  .post-eng{margin-left:auto;font-size:12px;font-weight:700;color:var(--pink);font-family:var(--font-heading);}

  @media(max-width:1200px){.loc-grid,.metrics-row,.audience-grid{grid-template-columns:repeat(2,1fr);}.charts-grid{grid-template-columns:1fr;}}
  @media(max-width:768px){.loc-grid,.metrics-row,.audience-grid{grid-template-columns:repeat(2,1fr);}.main{padding:20px;}.header{padding:16px 20px;}.nav-tabs{padding:12px 20px;overflow-x:auto;}.insights-grid{grid-template-columns:1fr;}}
  @media(max-width:500px){.loc-grid,.metrics-row,.audience-grid{grid-template-columns:1fr;}.header-right{display:none;}}
  @media(max-width:600px){.footer{flex-direction:column;text-align:center;gap:6px;padding:18px 20px;}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-area">
    <img class="logo-svg" src="logo.png" alt="FIT AF Logo">
    <div class="logo-divider"></div>
    <div class="logo-text">
      <span>FIT AF</span>
      <span>Digital Dashboard</span>
    </div>
  </div>
  <div class="header-right">
    <div class="header-date" id="currentDate"></div>
    <div class="header-badge">Live</div>
  </div>
</div>

<!-- NAV TABS -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('overview',this)">Overview</button>
  <button class="nav-tab" onclick="switchTab('social',this)">Social Media</button>
  <button class="nav-tab" onclick="switchTab('insights',this)">Insights</button>
  <button class="nav-tab" onclick="switchTab('audience',this)">Audience</button>
</div>

<!-- MAIN -->
<div class="main" id="mainContent"></div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-left">FIT AF Digital Dashboard &copy; 2026</div>
  <div class="footer-brand">Powered by <a href="https://brookerogersdesign.com" target="_blank">Howell'n & Partners</a></div>
</div>

<script>
// === DATA ===
const LOCATIONS = [
  { id:'407', name:'FIT 407', city:'Orlando', color:'#F43CE2' },
  { id:'gnv', name:'FIT Gainesville', city:'Gainesville', color:'#00F2EA' },
  { id:'jax', name:'FIT JAX', city:'Jacksonville', color:'#448AFF' },
  { id:'850', name:'FIT 850', city:'Tallahassee', color:'#FF9100' },
  { id:'af',  name:'FIT AF', city:'Multi', color:'#00E676' },
  { id:'corp', name:'@FITasFIRE', city:'Corporate', color:'#7C4DFF' }
];

const MONTHS = [
  { id:'sep26', label:'September 2026' },
  { id:'aug26', label:'August 2026' },
  { id:'jul26', label:'July 2026' },
  { id:'jun26', label:'June 2026' },
  { id:'may26', label:'May 2026' },
  { id:'apr26', label:'April 2026' },
  { id:'mar26', label:'March 2026' },
  { id:'feb26', label:'February 2026' },
  { id:'jan26', label:'January 2026' }
];

const DATA = {
  sep26: {
    '407': { posts:21, reach:'91.1K', reachNum:91129, interactions:'5.7K', intNum:5698, engagement:'6.25%', engNum:6.25, newFollowers:277,
             audience:{ gender:'Women', location:'Orlando', age:"20's-30's (IG) 40's (FB)" },
             insights:{ worked:'Community milestone and collab-driven content dominated, the "1,000 Classes" member spotlight and the "FIT x Marissa" performer collab reel were the top two posts by a wide margin, and carousels overall outperformed every other format. This tracks with your brand\'s community-over-competition identity: when content centers a real member\'s story or a named collaborator, your largely female, 25-44 audience shows up hardest because it feels personal and local rather than generic fitness content.',
                        didntWork:'The three lowest posts were all single-image, lower-effort posts without a strong narrative hook ("thank you for kind words," a generic workout-struggle shot, a recycled "FIT Girl Summer" callout), none cracked 4% engagement rate and all sat well below the account\'s monthly average. Standalone images as a format consistently lagged carousels and reels across the board, suggesting the weak performance is about format and story depth, not just topic.',
                        improvements:'Shift more of the single-image slots into carousels, even simple 2-3 slide versions, since that format alone nearly doubled average performance this month; and lean harder into the milestone/spotlight framework (member achievements, instructor features, behind-the-scenes collab content) as a recurring monthly series rather than a one-off, since it\'s clearly your highest-converting content type.',
                        audienceInsight:'Your audience is overwhelmingly female (82%) and concentrated in the 25-44 range (65% combined), with Orlando, Lake Butler, and Narcoossee as the top local hubs, exactly matching your target demo. This core audience responds to real people and real milestones over polished generic content, reinforcing that your "neighborhood pilates home" positioning is working when you actually show the neighborhood in the content.' },
             workingNow:[], needsAttention:[], bestNextMove:'' },
    'gnv': { posts:15, reach:'54.1K', reachNum:54060, interactions:'1.6K', intNum:1632, engagement:'3.02%', engNum:3.02, newFollowers:140,
             audience:{ gender:'Women', location:'Tallahassee', age:"18-20's" },
             insights:{ worked:'Carousels were the strongest format by a wide margin, driven mostly by the Sep 21 student-membership collab carousel that pulled in 79K views and 32.7K reach by tapping a partner\'s audience outside your existing follower base. Even excluding that outlier, carousels like the Sep 1 launch post held up well because multi-slide, info-dense content (pricing, how-to-join steps) gives people a reason to swipe and linger, which signals strongly to the algorithm.',
                        didntWork:'Reels underperformed as a category this month, the Sep 1 reel barely cracked 1,194 views and 764 reach, the weakest post of the month. Straightforward image posts without a collab or promo hook (Sep 16, Sep 28) also landed in the middle-to-bottom of the pack, suggesting single-image content without a strong offer or story isn\'t earning much organic push right now.',
                        improvements:'Lean into carousels as the default format instead of a once-in-a-while choice, and actively pursue more collab posts since the one you ran this month single-handedly tripled your total reach for the period. For reels, the content needs a stronger hook in the first second. Right now they\'re not earning the swipe-through or rewatch behavior that drives IG\'s distribution.',
                        audienceInsight:'Your audience is hyper-local, 79.9% of engaged accounts are in Gainesville itself, with small secondary pockets in Tampa, Jacksonville, Tallahassee, and New York (likely alumni). This isn\'t a broad-reach brand, it\'s a neighborhood one, so content that feels like "come see us this week" will consistently outperform generic fitness content aimed at a national audience.' },
             workingNow:[], needsAttention:[], bestNextMove:'' },
    'jax': { posts:16, reach:'16.6K', reachNum:16611, interactions:'631', intNum:631, engagement:'40.60%', engNum:40.60, newFollowers:371,
             audience:{ gender:'Women', location:'Tampa', age:"18-20's" },
             insights:{ worked:'Static images and carousels outperformed reels this month, with the top 3 posts all pulling 70+ engagements and sitting well above the 40-engagement median. These leaned on two things that align with the brand\'s voice: community-first language ("YOUR space," "FIT FAM") and genuine news/milestones (a new studio opening), which gives followers a concrete reason to comment, save, or share rather than just scroll past. The Grand Opening carousel\'s 10 shares (way above any other post) shows informational, multi-slide content travels when it\'s framed as something worth passing along to a friend.',
                        didntWork:'The lowest performers were softer, more introspective posts that lacked a clear hook or call-to-action, and all landed in the back half of the month when reach also dipped. Comments were nearly non-existent across the board, meaning even high-like posts aren\'t sparking conversation. The brand\'s own caption style, direct prompts like "Comment below" and "Tag your Pilates crew", wasn\'t used consistently; the posts with legitimate comment-bait phrasing in the caption still got zero replies, suggesting the CTA placement or follow-through needs work.',
                        improvements:'Lead more often with carousels and single, strong images over reels for announcements and community moments, since that\'s where the engagement actually concentrated. Build a deliberate comment-driving mechanic (a direct question in the first line of the caption, not buried at the end) and consider replying to early comments to seed activity. The late-month slump (Sep 21-30) also lines up with lower reach, worth testing whether posting frequency or timing dropped off and reinforcing the persona\'s best windows (Mon/Wed/Thu, 6-10pm) more tightly in that stretch.',
                        audienceInsight:'This audience responds to being spoken to directly and given something tangible, real news (grand opening), real routines (morning routine content), real spaces ("this is YOUR space"), not reflective or sentimental captions. Given the audience skews 25-34 and heavily female, content that feels like practical insider info or belonging-to-a-community pays off more than aspirational or emotional framing. They\'re liking generously but not yet commenting, which points to an engaged-but-passive audience that needs a more direct nudge to actually participate.' },
             workingNow:[], needsAttention:[], bestNextMove:'' },
    '850': { posts:15, reach:'26.6K', reachNum:26638, interactions:'1K', intNum:1006, engagement:'3.78%', engNum:3.78, newFollowers:168,
             audience:{ gender:'Women', location:'Gainesville', age:"18-20's" },
             insights:{ worked:'Carousels crushed it. The coach recruitment carousel hit 7,717 views and a 133% engagement rate by combining a clear opportunity hook with qualification requirements and a hard deadline. The single-image "FIT AF way" post also performed well (6,787 views, 111% engagement) thanks to the tag-your-crew CTA and the full 5-hashtag local stack.',
                        didntWork:'Reels underperformed across the board, and four posts fell meaningfully below their format baseline, including a carousel posted without a hashtag stack ("Community and Classes," 3,969 views vs. a 5,756 expected average) and a cluster of low-effort single-sentence image captions late in the month.',
                        improvements:'Deprioritize reels as a reach driver and reinvest that production time into carousels, especially recruitment/educational formats. When posting carousels, always include the 5-hashtag local stack, the weakest carousel this month skipped it. Tighten up caption CTAs on image posts, the lowest performers were vague ("Finding your people," "Thank you for the kind words") compared to top posts that had a specific ask (tag a friend, comment an emoji, apply by a date).',

let currentMonth = 'sep26';
let currentTab = 'overview';
let currentInsightLoc = '407';

// === DATE ===
document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// === HELPERS ===
function totalMetric(month, key) {
  const m = DATA[month];
  if (!m) return 0;
  return LOCATIONS.reduce((sum,loc) => sum + (m[loc.id] ? m[loc.id][key] || 0 : 0), 0);
}
function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}
function bestLoc(month, key) {
  const m = DATA[month];
  if (!m) return '';
  let best = '', bestVal = -1;
  LOCATIONS.forEach(loc => { if (m[loc.id] && m[loc.id][key] > bestVal) { bestVal = m[loc.id][key]; best = loc.id; } });
  return best;
}

// === TOP POSTS HELPERS ===
function getTopPosts(month) {
  const mp = TOP_POSTS[month];
  if (!mp) return [];
  // Merge all locations' posts into one array, sorted by views
  let all = [];
  LOCATIONS.forEach(loc => {
    if (mp[loc.id]) {
      mp[loc.id].forEach((p,i) => all.push({...p, locId:loc.id, locName:loc.name, locColor:loc.color}));
    }
  });
  all.sort((a,b) => b.views - a.views);
  return all;
}

function platformIcon(platform) {
  if (platform === 'Instagram') return '<div class="post-platform-icon" style="background:var(--instagram);">&#x1F4F7;</div>';
  if (platform === 'Facebook') return '<div class="post-platform-icon" style="background:var(--facebook);">&#x1F44D;</div>';
  return '<div class="post-platform-icon" style="background:var(--text-dim);">&#x1F4F1;</div>';
}

function typeBadgeColor(type) {
  const t = type.toUpperCase();
  if (t === 'REEL') return 'background:rgba(244,60,226,0.15);color:var(--pink);';
  if (t === 'CAROUSEL') return 'background:rgba(68,138,255,0.15);color:var(--blue);';
  if (t === 'IMAGE') return 'background:rgba(0,230,118,0.15);color:var(--green);';
  if (t === 'POST') return 'background:rgba(255,145,0,0.15);color:var(--orange);';
  return 'background:rgba(255,255,255,0.08);color:var(--text-dim);';
}

function renderTopPostsCards(month) {
  const posts = getTopPosts(month);
  if (posts.length === 0) return '';
  // Show top 6 on overview
  const show = posts.slice(0, 6);
  return `
    <div class="section-label">Top Performing Posts &mdash; ${MONTHS.find(m=>m.id===month)?.label || month}</div>
    <div class="posts-grid">
      ${show.map((p,i) => `
        <div class="post-card" style="cursor:${p.url?'pointer':'default'};" ${p.url?`onclick="window.open('${p.url}','_blank')"`:''}>
          <div class="post-card-header">
            ${platformIcon(p.platform)}
            <span style="font-size:12px;font-weight:600;color:var(--text);">${p.platform}</span>
            <span class="post-type-badge" style="${typeBadgeColor(p.type)}">${p.type}</span>
            <span style="font-size:10px;color:${p.locColor};font-weight:600;margin-left:4px;">${p.locName}</span>
            <span class="post-rank">#${i+1}</span>
          </div>
          <div class="post-caption">${p.caption}</div>

function getLowPosts(month) {
  const mp = LOW_POSTS[month];
  if (!mp) return [];
  let all = [];
  LOCATIONS.forEach(loc => {
    if (mp[loc.id]) {
      mp[loc.id].forEach(p => all.push({...p, locId:loc.id, locName:loc.name, locColor:loc.color}));
    }
  });
  return all;
}

// === CHART SETUP ===
Chart.defaults.color = 'rgba(255,255,255,0.45)';
Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
Chart.defaults.font.family = "'Avenir','Avenir Next','Inter',sans-serif";
let charts = {};
function destroyChart(id) { if(charts[id]){charts[id].destroy();delete charts[id];} }
function getLocColors() { return LOCATIONS.map(l=>l.color); }
function getLocNames() { return LOCATIONS.map(l=>l.name); }
function getMetricArray(key) { const md=DATA[currentMonth]; return LOCATIONS.map(l=> md&&md[l.id] ? md[l.id][key] : 0); }

function initOverviewCharts() {
  destroyChart('reachChart'); destroyChart('engChart'); destroyChart('engTrendChart');

  // Engagement trend line chart
  const ctxTrend = document.getElementById('engTrendChart')?.getContext('2d');
  if(ctxTrend) charts['engTrendChart'] = new Chart(ctxTrend, {
    type:'line',
    data:{
      labels: TREND_LABELS,
      datasets: LOCATIONS.map(loc => ({
        label: loc.name,
        data: ENG_TREND[loc.id],
        borderColor: loc.color,
        backgroundColor: 'transparent',
        tension: 0.4,
        borderWidth: 2.5,
        pointRadius: 5,
        pointBackgroundColor: loc.color,
        pointBorderColor: '#0B0B12',
        pointBorderWidth: 2
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', labels:{ usePointStyle:true, pointStyle:'circle', padding:20, font:{size:11} } } },
      scales:{
        y:{ grid:{color:'rgba(255,255,255,0.04)'}, ticks:{callback:v=>v+'%'} },
        x:{ grid:{display:false} }
      }
    }
  });

  const ctx1 = document.getElementById('reachChart')?.getContext('2d');
  if(ctx1) charts['reachChart'] = new Chart(ctx1, {
    type:'bar', data:{ labels:getLocNames(), datasets:[{ label:'Reach', data:getMetricArray('reachNum'), backgroundColor:getLocColors().map(c=>c+'CC'), borderRadius:10, barPercentage:0.6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{callback:v=>formatNum(v)}},x:{grid:{display:false}}} }
  });
  const ctx2 = document.getElementById('engChart')?.getContext('2d');
  if(ctx2) charts['engChart'] = new Chart(ctx2, {
    type:'doughnut', data:{ labels:getLocNames(), datasets:[{ data:getMetricArray('engNum'), backgroundColor:getLocColors(), borderWidth:0, spacing:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:10}}}} }
  });
}

function initSocialCharts() {
  destroyChart('followersChart'); destroyChart('reachDoughnut');
  const ctx1 = document.getElementById('followersChart')?.getContext('2d');
  if(ctx1) charts['followersChart'] = new Chart(ctx1, {
    type:'bar', data:{ labels:getLocNames(), datasets:[{ label:'New Followers', data:getMetricArray('newFollowers'), backgroundColor:getLocColors().map(c=>c+'CC'), borderRadius:10, barPercentage:0.6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(255,255,255,0.04)'}},x:{grid:{display:false}}} }
  });
  const ctx2 = document.getElementById('reachDoughnut')?.getContext('2d');
  if(ctx2) charts['reachDoughnut'] = new Chart(ctx2, {
    type:'doughnut', data:{ labels:getLocNames(), datasets:[{ data:getMetricArray('reachNum'), backgroundColor:getLocColors(), borderWidth:0, spacing:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:10}}}} }
  });
}

function initAudienceCharts() {
  destroyChart('audEngChart'); destroyChart('audSplitChart');
  const ctx1 = document.getElementById('audEngChart')?.getContext('2d');
  if(ctx1) charts['audEngChart'] = new Chart(ctx1, {
    type:'bar', data:{ labels:getLocNames(), datasets:[{ label:'Engagement %', data:getMetricArray('engNum'), backgroundColor:getLocColors().map(c=>c+'CC'), borderRadius:10, barPercentage:0.6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}} }
  });
  const ctx2 = document.getElementById('audSplitChart')?.getContext('2d');
  if(ctx2) charts['audSplitChart'] = new Chart(ctx2, {
    type:'doughnut', data:{ labels:getLocNames(), datasets:[{ data:getMetricArray('newFollowers'), backgroundColor:getLocColors(), borderWidth:0, spacing:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:10}}}} }
  });
}

// === NAV ===
function switchTab(tab, btn) {
  document.querySelectorAll('.nav-tabs .nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentTab = tab;
  render();
}
function setMonth(month) {
  currentMonth = month;
  render();
}
function setInsightLoc(locId) {
  currentInsightLoc = locId;
  render();
}

// Init
render();
</script>
</body>
</html>
